name: sqflite_live
description: Sqflite live server for viewing db data on web-based local server.
version: 1.2.1

environment:
  sdk: '>=3.0.0 <4.0.0'
repository: https://github.com/nemr0/sqflite_live
flutter:
  assets:
    - sqlite_viewer/
    - sqlite_viewer/css/
    - sqlite_viewer/img/
    - sqlite_viewer/js/
    - sqlite_viewer/js/ace/
# Add regular dependencies here.
dependencies:
  # Lower bounds kept deliberately permissive so consumers on a wide range of
  # SDKs/transitive pins can still resolve; upper bounds stop at the next major.
  sqflite: '>=2.2.0 <3.0.0'
  path_provider: '>=2.0.0 <3.0.0'
  path: '>=1.8.0 <2.0.0'
  mime: '>=1.0.0 <3.0.0'
  flutter:
    sdk: flutter
dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
  flutter_test:
    sdk: flutter
